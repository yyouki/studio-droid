name: Build Nemo Editor Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prototypes/nemo-editor/**"
      - ".github/workflows/build-nemo-editor-prototype.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK tools package was removed; install only platform-tools here.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build prototype APK
        run: |
          gradle -p prototypes/nemo-editor :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-droid-nemo-prototype-debug-apk
          path: prototypes/nemo-editor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
